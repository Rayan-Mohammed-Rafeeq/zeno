version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zeno-postgres
    environment:
      POSTGRES_DB: zeno
      POSTGRES_USER: zeno
      POSTGRES_PASSWORD: zeno
    ports:
      - "5432:5432"
    volumes:
      - zeno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeno -d zeno"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Python ML inference service ───────────────────────────────────────
  # Requires model artefacts to be present at ./ml/data/artifacts/xgboost/
  # Train first: cd ml && python scripts/train_full_pipeline.py --synthetic
  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile.ml
    container_name: zeno-ml-service
    ports:
      - "8001:8001"
    volumes:
      # Mount artefacts from host so models survive container restarts
      - ./ml/data/artifacts:/app/data/artifacts:ro
    environment:
      ZENO_MODEL_DIR: /app/data/artifacts/xgboost
      ML_SERVICE_HOST: 0.0.0.0
      ML_SERVICE_PORT: "8001"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles:
      - full
      - ml

  # ── Spring Boot backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zeno-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/zeno
      DATABASE_USERNAME: zeno
      DATABASE_PASSWORD: zeno
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-must-be-at-least-256-bits}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_placeholder}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-noreply@zeno.app}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      AI_API_KEY: ${AI_API_KEY:-placeholder}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      # ML service integration — set to true when ml-service is running
      ML_SERVICE_ENABLED: ${ML_SERVICE_ENABLED:-false}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001}
      ML_SERVICE_TIMEOUT_SECONDS: ${ML_SERVICE_TIMEOUT_SECONDS:-5}
    ports:
      - "8080:8080"
    profiles:
      - full

volumes:
  zeno_pgdata:

# ── Usage ─────────────────────────────────────────────────────────────────
# Start everything (requires model artefacts + Docker images):
#   docker compose --profile full up
#
# Start only ML service + postgres (for local backend dev):
#   docker compose --profile ml up
#
# Start only postgres (for fully local dev):
#   docker compose up postgres
#
# Train models before starting ML service:
#   cd ml && python scripts/train_full_pipeline.py --synthetic --n-samples 8000

version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Zeno — local development stack
# Usage: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: zeno-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-zeno}
      POSTGRES_USER: ${DB_USER:-zeno}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - zeno_pgdata:/var/lib/postgresql/data
      - ./infrastructure/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zeno}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zeno-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot API ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: zeno-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      API_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-zeno}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-zeno}
      DB_USER: ${DB_USER:-zeno}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-bytes}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:-86400000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password123}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@example.test}
      PASSWORD_RESET_EXPIRY_MINUTES: ${PASSWORD_RESET_EXPIRY_MINUTES:-30}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8001
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-true}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-15000}
      AI_RETRY_COUNT: ${AI_RETRY_COUNT:-1}
    ports:
      - "${API_PORT:-8080}:8080"

  # ── Refill intelligence service (LangGraph) ────────────────────────────────
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: zeno-ai
    restart: unless-stopped
    env_file:
      - ./apps/ai/.env
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      ENVIRONMENT: ${APP_ENV:-development}
      PACK_DEFAULT_BUDGET_USD: ${PACK_DEFAULT_BUDGET_USD:-0.05}
    ports:
      - "${AI_PORT:-8001}:8001"

  # ── React Web App ───────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: zeno-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  zeno_pgdata:

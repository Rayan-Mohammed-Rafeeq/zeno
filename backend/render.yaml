services:
  - type: web
    name: zeno-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRY_MINUTES
        value: 60
      - key: APP_FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        value: Zeno <noreply@alliededge.app>
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: minimax/minimax-m3
      - key: AI_ENABLED
        value: true
      - key: ML_SERVICE_ENABLED
        value: false
      - key: ML_SERVICE_URL
        value: http://localhost:8001
      - key: ML_SERVICE_TIMEOUT_SECONDS
        value: 5
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_ENABLED
        value: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

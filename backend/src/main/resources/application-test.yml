spring:
  datasource:
    url: jdbc:h2:mem:niro_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

niro:
  jwt:
    secret: test-secret-for-unit-tests-must-be-at-least-256-bits-long-here
    access-token-expiry-minutes: 60
  frontend-url: http://localhost:5173
  resend:
    api-key: test-key
    from-address: test@niro.app
  ai:
    enabled: false
    api-key: test-key
  risk:
    thresholds:
      refund-rate-anomaly-score: 25
      transaction-velocity-score: 20
      shared-device-score: 25
      shared-ip-score: 15
      amount-similarity-score: 10
      new-account-score: 5
      coordinated-behavior-score: 30
      medium-risk-threshold: 40
      high-risk-threshold: 70
      critical-risk-threshold: 90
  evaluation:
    false-positive-cost:
      manual-review-cost: 15.0
      held-transaction-opportunity-cost: 25.0

logging:
  level:
    com.niro: WARN
    org.springframework.security: WARN

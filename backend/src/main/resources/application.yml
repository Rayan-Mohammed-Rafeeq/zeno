spring:
  application:
    name: niro

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

niro:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:60}

  frontend-url: ${APP_FRONTEND_URL}

  resend:
    api-key: ${RESEND_API_KEY}
    from-address: ${RESEND_FROM_ADDRESS}

  ai:
    api-key: ${AI_API_KEY:placeholder}
    api-url: ${AI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}
    enabled: ${AI_ENABLED:false}

  risk:
    thresholds:
      refund-rate-anomaly-score: 25
      transaction-velocity-score: 20
      shared-device-score: 25
      shared-ip-score: 15
      amount-similarity-score: 10
      new-account-score: 5
      coordinated-behavior-score: 30
      medium-risk-threshold: 40
      high-risk-threshold: 70
      critical-risk-threshold: 90

  evaluation:
    false-positive-cost:
      manual-review-cost: 15.0
      held-transaction-opportunity-cost: 25.0

  ml:
    enabled: ${ML_SERVICE_ENABLED:false}
    service-url: ${ML_SERVICE_URL:http://localhost:8001}
    timeout-seconds: ${ML_SERVICE_TIMEOUT_SECONDS:5}
    max-retries: ${ML_SERVICE_MAX_RETRIES:1}

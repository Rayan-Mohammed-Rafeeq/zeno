spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${API_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRY_MS}

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}
  password-reset-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:30}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

zeno:
  ai:
    service:
      url: ${AI_SERVICE_URL:http://localhost:8001}
      api-key: ${AI_SERVICE_API_KEY:}
      enabled: ${AI_SERVICE_ENABLED:true}
      timeout-ms: ${AI_SERVICE_TIMEOUT_MS:15000}
      max-retries: ${AI_RETRY_COUNT:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.zeno: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
